name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  java:
    name: Java - ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [ea-project, ea_project_javafx]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: ./ea-project/mvnw -B -f ${{ matrix.module }}/pom.xml test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports/
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Android SDK
        run: sdkmanager 'platforms;android-37'
      - name: Test, lint e APK debug
        working-directory: ea_project_application
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports
          path: ea_project_application/app/build/reports/
          retention-days: 7
