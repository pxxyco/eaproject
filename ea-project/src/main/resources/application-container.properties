# Configuration for the self-contained backend image. Local development stays unchanged.
server.port=8080
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:file:/app/certs/server.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
spring.devtools.restart.enabled=false
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
app.storage.path=/app/storage/photo
app.chat.storage.path=/app/storage/private-chat
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
