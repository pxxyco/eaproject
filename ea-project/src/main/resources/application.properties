spring.config.import=optional:application-dev.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PSW}

spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.storage.path=photo

server.tomcat.threads.max=100
server.tomcat.max-http-form-post-size=50MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.datasource.hikari.maximum-pool-size=10

spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms
spring.devtools.restart.exclude=static/**,public/**,templates/**
# Log4j2 is the only logging provider; do not write SQL or credentials to the console.
logging.config=classpath:log4j2.xml
spring.jpa.show-sql=false
springdoc.swagger-ui.persistAuthorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.paths-to-match=/api/**
app.security.jwt-issuer=itinera
